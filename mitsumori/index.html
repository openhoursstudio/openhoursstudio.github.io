<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="見積・契約">
<meta name="theme-color" content="#18202C">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<!-- Internal tool for the Japan team (price calculator, quote/invoice, contract). Not linked from the site; hidden from search.
     Source of truth: this file. The same content (without this head) is published as a private Claude artifact. -->
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Open Hours 見積・契約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Vazirmatn:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-first column. Top: tab strip (見積 / 書類 / 契約 / تیم). The calculator is a stack of service sheets with
   checklist rows; a sticky tally bar at the bottom always shows 月額 / 初期 / 期間合計. Documents render as an A4 "paper" sheet. */
:root{
 --bg:#EEF0F3; --paper:#FFFFFF; --ink:#18202C; --muted:#5A6474; --line:#D7DCE4; --soft:#F5F7FA;
 --ai:#23417A; --ai-soft:#E3EAF5; --shu:#B8432B; --shu-soft:#F7E7E2; --ok:#1F7A4D; --ok-soft:#E1F1E8; --warn:#93600A; --warn-soft:#FAEFD8;
 --f-ja:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
 --f-fa:"Vazirmatn",Tahoma,sans-serif;
 --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0F1218; --paper:#171B23; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2A303B; --soft:#1D222B;
 --ai:#93B2EA; --ai-soft:#1D2740; --shu:#F08C74; --shu-soft:#3A221D; --ok:#6FCF9C; --ok-soft:#163125; --warn:#E6B45A; --warn-soft:#382B14; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0F1218; --paper:#171B23; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2A303B; --soft:#1D222B;
 --ai:#93B2EA; --ai-soft:#1D2740; --shu:#F08C74; --shu-soft:#3A221D; --ok:#6FCF9C; --ok-soft:#163125; --warn:#E6B45A; --warn-soft:#382B14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ja);font-size:15px;line-height:1.7;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 140px}
body.fa .ui{font-family:var(--f-fa)}
.wrap{max-width:860px;width:100%;min-width:0;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sheet li,.sheet p,.sheet td{overflow-wrap:anywhere}
h1,h2,h3{margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.02em;min-width:0}
.brand h1 small{font-weight:500;color:var(--muted);font-size:12px;margin-inline-start:6px}
.lang{display:flex;flex:none;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
nav.tabs a{text-align:center;text-decoration:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:7px 4px;border-radius:8px}
nav.tabs a[aria-current="page"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.sheet{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sheet h2{font-size:16px;font-weight:700}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:12.5px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:8px 10px;font-size:16px;width:100%}
.f textarea{min-height:64px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--paper)}
.chip small{opacity:.8;font-size:11.5px;margin-inline-start:6px;font-family:var(--f-num)}

/* service sheet */
.svc{padding:0;gap:0;overflow:hidden}
.svc-head{display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;user-select:none}
.svc-head input{width:22px;height:22px;accent-color:var(--ai);flex:none}
.svc-head .t{flex:1;min-width:0}
.svc-head .t b{display:block;font-size:16px}
.svc-head .t span{font-size:12.5px;color:var(--muted)}
.svc-head .sum{text-align:end;font-size:13px}
.svc-head .sum b{display:block;font-family:var(--f-num);font-size:16px;font-weight:500}
.svc-body{border-top:1px solid var(--line);padding:6px 16px 14px;display:flex;flex-direction:column;gap:2px}
.svc-head .fold{flex:none;width:32px;height:32px;margin-inline-end:-6px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:8px;display:grid;place-items:center}
.svc-head .fold:hover{background:var(--line)}
.svc-head .fold svg{width:16px;height:16px;transition:transform .15s}
.svc.shut .svc-head .fold svg{transform:rotate(-90deg)}.svc.off .svc-body,.svc.shut .svc-body{display:none}
.svc.off .svc-head{opacity:.75;cursor:default}
.grp{padding-block:10px 4px;display:flex;flex-direction:column;gap:6px;border-bottom:1px dashed var(--line)}
.grp:last-child{border-bottom:0}
.grp > .q{font-size:13.5px;font-weight:700}
.opt{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:7px 8px;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--soft)}
.opt input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--ai)}
.opt .l{min-width:0}
.opt .l small{display:block;color:var(--muted);font-size:12px;line-height:1.5}
.opt .p{text-align:end;font-size:12.5px;color:var(--muted);line-height:1.5}
.opt.sel{background:var(--ai-soft)}
.opt.sel .p{color:var(--ink)}
.base{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:7px 8px;font-size:14px}
.base .dot{width:8px;height:8px;border-radius:50%;background:var(--ai);margin:8px 0 0 6px}
.range{font-size:12.5px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:6px 10px;margin-top:6px}
.note{border-inline-start:3px solid var(--ai);background:var(--ai-soft);padding:9px 12px;border-radius:6px;font-size:13.5px}
.note.warn{border-color:var(--shu);background:var(--shu-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}

/* tally bar */
.tally{position:fixed;inset:auto 0 0;z-index:6;background:var(--ink);color:var(--paper);
 padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tally .in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:center}
.tally .k{font-size:11px;opacity:.75;display:block}
.tally .v{font-family:var(--f-num);font-size:16px}
.tally button{border:0;background:var(--paper);color:var(--ink);border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:13.5px;white-space:nowrap}
@media (max-width:420px){.tally .in{grid-template-columns:1fr 1fr 1fr}.tally button{grid-column:1/-1}}

.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--ai);background:var(--ai);color:var(--paper);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:700;font-size:14px}
.btn.ghost{background:transparent;color:var(--ai)}
.msg{font-size:13px;min-height:1.2em}
details.sheet summary{cursor:pointer;font-weight:700}
details.sheet[open] summary{margin-bottom:6px}

/* team */
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:12.5px}
table.t td.n{text-align:end}
.tw{overflow-x:auto;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpis div{background:var(--soft);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column}
.kpis span{font-size:12px;color:var(--muted)}
.kpis b{font-family:var(--f-num);font-weight:500;font-size:17px}
.pill{display:inline-block;border-radius:999px;padding:0 9px;font-size:12px;font-weight:700}
.pill.good{background:var(--ok-soft);color:var(--ok)} .pill.mid{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--shu-soft);color:var(--shu)}
ul.list{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}

/* the paper (見積書 / 請求書 / 契約書) — same CSS is shipped inside downloaded files */
.paperbox{overflow-x:auto;min-width:0;border-radius:6px}
@media print{body{background:#fff;padding:0}body::before,header.top,.tally,.sheet,#v-calc,#v-team{display:none!important}.paperbox{overflow:visible}.wrap{max-width:none;gap:0}}
</style>
<style id="papercss">
.paper{background:#fff;color:#1a1a1a;font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:12.5px;line-height:1.75;
 width:100%;max-width:794px;margin:0 auto;padding:36px 34px;border:1px solid #d9d9d9}
.paper.fa{font-family:"Vazirmatn",Tahoma,sans-serif;direction:rtl}
.paper h1{font-size:24px;letter-spacing:.5em;text-align:center;margin:0 0 18px;font-weight:700;padding-bottom:6px;border-bottom:3px double #1a1a1a}
.paper.fa h1{letter-spacing:0}
.paper .n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.paper .meta{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.paper .to{font-size:17px;font-weight:700;border-bottom:1px solid #1a1a1a;padding:0 12px 2px 0;min-width:240px}
.paper .from{text-align:right;font-size:12px;position:relative;padding-right:64px;min-height:64px}
.paper .seal{position:absolute;right:0;top:0;width:56px;height:56px;border:1.5px solid #b8432b;color:#b8432b;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:4px}
.paper .total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:2px solid #1a1a1a;padding:8px 14px;margin:6px 0 16px;flex-wrap:wrap}
.paper .total b{font-size:20px}
.paper table{width:100%;border-collapse:collapse;margin-bottom:12px}
.paper th,.paper td{border:1px solid #9a9a9a;padding:5px 7px;text-align:left;vertical-align:top}
.paper th{background:#eef1f6;font-weight:700;font-size:11.5px}
.paper td.r,.paper th.r{text-align:right}
.paper tr.sec td{background:#eceff4;font-weight:700}
.paper tr.sv td{font-weight:700;border-bottom:0;padding-top:7px}
.paper td.it{padding-left:1.4em}
.paper .sum{width:auto;margin-left:auto;min-width:280px}
.paper .sum td{border:0;border-bottom:1px solid #c9c9c9}
.paper .sum tr.g td{font-weight:700;font-size:14px;border-bottom:2px solid #1a1a1a}
.paper .box{border:1px solid #9a9a9a;padding:8px 12px;margin-top:10px;font-size:11.5px;white-space:pre-wrap}
.paper .art{margin:0 0 10px}
.paper .art h3{font-size:13px;margin:0 0 2px}
.paper .art p{margin:0 0 2px}
.paper .art ol{margin:0;padding-left:1.6em}
.paper.fa .art ol{padding-left:0;padding-right:1.6em}
.paper .sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
.paper .sign div{border-top:1px solid #1a1a1a;padding-top:6px;min-height:110px;position:relative;font-size:12px}
.paper .sign .seal{top:auto;bottom:4px}
.paper.fa .sign .seal{right:auto;left:0}
.paper .pre{font-size:11px;color:#555}
.paper .pagebreak{break-before:page;margin-top:28px}
@media (max-width:560px){.paper{padding:22px 14px;font-size:11px}.paper th,.paper td{padding:4px 4px}.paper td.it{padding-left:.8em}.paper h1{font-size:19px;letter-spacing:.3em}.paper .sign{grid-template-columns:1fr}}
@media print{.paper{border:0;padding:0;max-width:none}}
</style>

</head>
<body>
<div class="wrap">
 <header class="top ui">
  <div class="brand">
   <h1>Open Hours 見積・契約<small id="hSub"></small></h1>
   <div class="lang" role="group" aria-label="Language">
    <button id="lgFa" type="button">فارسی</button><button id="lgJa" type="button">日本語</button>
   </div>
  </div>
  <nav class="tabs" aria-label="Sections">
   <a href="#calc" data-v="calc" id="tbCalc"></a>
   <a href="#doc" data-v="doc" id="tbDoc"></a>
   <a href="#contract" data-v="contract" id="tbCon"></a>
   <a href="#team" data-v="team" id="tbTeam"></a>
  </nav>
 </header>

 <!-- 1. calculator -->
 <section id="v-calc" class="wrap" style="gap:14px">
  <div class="sheet">
   <h2 class="ui" id="lCust"></h2>
   <div class="row2">
    <div class="f"><label for="cName" id="lName"></label><input id="cName" autocomplete="off"></div>
    <div class="f"><label for="cPerson" id="lPerson"></label><input id="cPerson" autocomplete="off"></div>
   </div>
   <div class="row2">
    <div class="f"><label for="cStart" id="lStart"></label><input id="cStart" type="date"></div>
    <div class="f"><label id="lMonths"></label><div class="chips" id="monthChips"></div></div>
   </div>
   <p class="small muted ui" id="termNote"></p>
  </div>
  <div id="svcList" class="wrap" style="gap:12px"></div>
  <div class="sheet">
   <h2 class="ui" id="lPay"></h2>
   <label class="opt" id="splitRow"><input type="checkbox" id="cSplit"><span class="l ui" id="lSplit"></span><span class="p"></span></label>
   <div class="row2">
    <div class="f"><label for="cDisc" id="lDisc"></label><input id="cDisc" type="number" inputmode="numeric" min="0" step="1000"></div>
   </div>
   <div id="calcWarn" class="wrap" style="gap:8px"></div>
  </div>
 </section>

 <!-- 2. documents -->
 <section id="v-doc" class="wrap" style="gap:14px" hidden>
  <div class="sheet ui">
   <div class="chips" id="docChips"></div>
   <div class="row2">
    <div class="f"><label for="dDate" id="lDDate"></label><input id="dDate" type="date"></div>
    <div class="f" id="fBillMonth"><label for="dMonth" id="lDMonth"></label><input id="dMonth" type="month"></div>
    <div class="f"><label for="dNo" id="lDNo"></label><input id="dNo" autocomplete="off"></div>
   </div>
   <div class="btns"><button class="btn" id="dlDoc" type="button"></button><button class="btn ghost" id="cpDoc" type="button"></button><button class="btn ghost onsite" id="prDoc" type="button" hidden></button></div>
   <p class="msg" id="docMsg" aria-live="polite"></p>
  </div>
  <div class="paperbox"><div id="docOut"></div></div>
 </section>

 <!-- 3. contract -->
 <section id="v-contract" class="wrap" style="gap:14px" hidden>
  <div class="sheet ui">
   <div class="chips" id="conChips"></div>
   <div class="row2">
    <div class="f"><label for="kAddr" id="lKAddr"></label><input id="kAddr" autocomplete="off"></div>
    <div class="f"><label for="kTel" id="lKTel"></label><input id="kTel" autocomplete="off"></div>
    <div class="f"><label for="kSignDate" id="lKDate"></label><input id="kSignDate" type="date"></div>
   </div>
   <div class="btns"><button class="btn" id="dlCon" type="button"></button><button class="btn ghost onsite" id="prCon" type="button" hidden></button></div>
   <p class="msg" id="conMsg" aria-live="polite"></p>
  </div>
  <div class="paperbox"><div id="conOut"></div></div>
 </section>

 <!-- 4. team -->
 <section id="v-team" class="wrap" style="gap:14px" hidden>
  <div class="sheet ui" id="teamMargin"></div>
  <details class="sheet ui" id="setBox">
   <summary id="lSet"></summary>
   <div class="row2">
    <div class="f"><label for="sName" id="lSName"></label><input id="sName"></div>
    <div class="f"><label for="sPerson" id="lSPerson"></label><input id="sPerson"></div>
    <div class="f"><label for="sAddr" id="lSAddr"></label><input id="sAddr"></div>
    <div class="f"><label for="sTel" id="lSTel"></label><input id="sTel"></div>
    <div class="f"><label for="sMail" id="lSMail"></label><input id="sMail"></div>
    <div class="f"><label for="sT" id="lST"></label><input id="sT" placeholder="T1234567890123"></div>
    <div class="f"><label for="sCourt" id="lSCourt"></label><input id="sCourt"></div>
    <div class="f"><label for="sAbroad" id="lSAbroad"></label><input id="sAbroad" placeholder="例：イラン、ドイツ"></div>
    <div class="f"><label for="sRate" id="lSRate"></label><input id="sRate" type="number" inputmode="numeric" step="100"></div>
   </div>
   <div class="f"><label for="sBank" id="lSBank"></label><textarea id="sBank"></textarea></div>
   <div class="btns"><button class="btn" id="sSave" type="button"></button></div>
   <p class="msg" id="setMsg" aria-live="polite"></p>
   <p class="small muted" id="setNote"></p>
  </details>
  <div class="sheet ui" id="teamGuide"></div>
 </section>
</div>

<div class="tally ui" id="tally"><div class="in">
 <div><span class="k" id="kMo"></span><span class="v" id="vMo"></span></div>
 <div><span class="k" id="kIn"></span><span class="v" id="vIn"></span></div>
 <div><span class="k" id="kTot"></span><span class="v" id="vTot"></span></div>
 <button type="button" id="goDoc"></button>
</div></div>

<script>
(function(){
'use strict';
/* ================= PRICE BOOK (launch prices, 2026-11) =================
   Every number is yen. mo = monthly fee, init = one-time fee, h = team hours per month,
   hi = team hours one-time, c = direct cost per month (train fare, printing, server), ci = direct cost one-time.
   Edit prices here only. */
const SVC = [
 { id:'meo', ja:'Googleマップ運用（MEO）', fa:'مدیریت گوگل‌مپ (MEO)', minTerm:1,
   jaD:'Googleで「近くのカフェ」などと探した人に、お店の情報・写真・口コミがきちんと見えるようにします。',
   faD:'وقتی کسی در گوگل‌مپ دنبال «کافه‌ی نزدیک» می‌گردد، صفحه‌ی مغازه کامل، به‌روز و با عکس و جواب نظرها دیده شود.',
   base:[{ja:'プロフィール運用・月次レポート',fa:'مدیریت پروفایل و گزارش ماهانه',jaS:'投稿 月4回／口コミ返信 月10件まで／営業時間・メニュー更新',faS:'۴ پست در ماه، جواب ۱۰ نظر، به‌روز کردن ساعت و منو',mo:20000,h:4}],
   groups:[
    {id:'setup',t:'radio',dj:'Google登録',ja:'今のGoogleの登録状態は？',fa:'وضعیت فعلی صفحه‌ی گوگل؟',opts:[
     {id:'have',ja:'オーナー確認済み・管理できている',fa:'تأیید مالکیت شده و دسترسی داریم',init:0,hi:1},

const today = () => { const d=new Date(); return iso(d); };
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addMonths(s,m){ const d=new Date(s+'T00:00:00'); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+m); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return d; }
function endDate(s,m){ const d=addMonths(s,m); d.setDate(d.getDate()-1); return iso(d); }
function firstOfNext(){ const d=new Date(); return iso(new Date(d.getFullYear(),d.getMonth()+1,1)); }
function jdate(s){ if(!s) return '　　年　月　日'; const [y,m,d]=s.split('-').map(Number); return `${y}年${m}月${d}日`; }
function fdate(s){ if(!s) return ''; const [y,m,d]=s.split('-').map(Number); return `${y}/${m}/${d}`; }

/* ================= pricing engine ================= */
const yen = v => (v<0?'-':'')+'¥'+Math.abs(Math.round(v)).toLocaleString('en-US');
const r100 = v => Math.round(v/100)*100;
function svcLines(s, sel){
 // returns chosen lines: {ja, fa, init, mo, h, hi, c, ci}
 const out=[];
 for(const b of s.base) out.push(Object.assign({kind:'base'},b));
 for(const g of s.groups){
  if(g.t==='radio'){ const o=g.opts.find(o=>o.id===sel[g.id])||g.opts[0]; out.push(Object.assign({kind:'opt',q:g},o)); }
  else for(const o of g.opts) if((sel[g.id]||[]).includes(o.id)) out.push(Object.assign({kind:'opt',q:g},o));
 }
 return out;
}
function svcRange(s){
 let mn={mo:0,init:0}, mx={mo:0,init:0};
 for(const b of s.base){ mn.mo+=b.mo||0; mx.mo+=b.mo||0; mn.init+=b.init||0; mx.init+=b.init||0; }
 for(const g of s.groups){
  if(g.t==='radio'){ mn.mo+=Math.min(...g.opts.map(o=>o.mo||0)); mx.mo+=Math.max(...g.opts.map(o=>o.mo||0));
   mn.init+=Math.min(...g.opts.map(o=>o.init||0)); mx.init+=Math.max(...g.opts.map(o=>o.init||0)); }
  else for(const o of g.opts){ mx.mo+=o.mo||0; mx.init+=o.init||0; }
 }
 return {mn,mx};
}
const dl_ = l => (l.q&&l.q.dj? l.q.dj+'：' : '')+l.ja;
function sum(lines,k){ return lines.reduce((a,l)=>a+(l[k]||0),0); }
function compute(){
 const m=state.months, d=DISC(m), warn=[];
 const per=[];
 for(const s of SVC){ if(!state.svc[s.id].on) continue;
  const lines=svcLines(s,state.svc[s.id].sel);
  per.push({s,lines,mo:sum(lines,'mo'),init:sum(lines,'init'),h:sum(lines,'h'),hi:sum(lines,'hi'),c:sum(lines,'c'),ci:sum(lines,'ci')});
  if(m<s.minTerm) warn.push(['warn',tr('wLine')]);
 }
 if(!per.length) warn.push(['warn',tr('wNone')]);
 const moList=sum(per,'mo');
 const moDisc=r100(moList*d);
 let moNet=moList-moDisc, floorAdj=0;
 if(per.length && moNet<FLOOR_MO){ floorAdj=FLOOR_MO-moNet; moNet=FLOOR_MO; warn.push(['note',tr('wFloor')]); }
 const initList=sum(per,'init');
 let dis=Math.max(0,Math.round(+state.discount||0));
 if(dis>initList){ dis=initList; if(L()==='fa') warn.push(['note',tr('wDisc')]); }
 const initNet=initList-dis;
 let split=state.split, splitAmt=0;
 if(split && m<SPLIT_MIN){ split=false; warn.push(['note',tr('wSplit')]); }
 if(split) splitAmt=Math.ceil(initNet/m);           // keep exact yen so the sum never falls short
 const initDue = split?0:initNet;
 const moDue = moNet+splitAmt;
 const total = initNet + moNet*m;
 return {m,d,per,moList,moDisc,floorAdj,moNet,initList,dis,initNet,split,splitAmt,initDue,moDue,total,warn,
  h:sum(per,'h'),hi:sum(per,'hi'),c:sum(per,'c'),ci:sum(per,'ci')};
}

  let h=`<div class="svc-head"${st.on?` data-fold="${s.id}"`:''}><input type="checkbox" data-svc="${s.id}" aria-label="${esc(s[L()])}" ${st.on?'checked':''}><span class="t"><b>${esc(s[L()])}</b><span class="ui">${esc(L()==='fa'?s.faD:s.jaD)}</span></span><span class="sum" id="sum-${s.id}"></span>${fold}</div><div class="svc-body" id="body-${s.id}">`;
  for(const b of s.base) h+=`<div class="base"><span class="dot"></span><span class="l">${esc(b[L()])}<small class="muted" style="display:block;font-size:12px">${esc(L()==='fa'?b.faS:b.jaS)}</small></span><span class="p small muted">${priceTag(b)}</span></div>`;
  for(const g of s.groups){
   h+=`<div class="grp"><div class="q ui">${esc(g[L()])}</div>`;

    h+=`<label class="opt${on?' sel':''}"><input type="${g.t==='radio'?'radio':'checkbox'}" name="${s.id}-${g.id}" data-s="${s.id}" data-g="${g.id}" data-o="${o.id}" ${on?'checked':''}><span class="l">${esc(o[L()])}</span><span class="p">${priceTag(o)}</span></label>`;
   }

  el.innerHTML=h; box.appendChild(el);
 }

const taxOn = () => /^T\d{13}$/.test((set.tnum||'').trim());
function issuerBlock(){

function docRows(r, mode){
 // mode: quote | first | monthly
 let rows='', sub=0;
 const svrow=p=>`<tr class="sv"><td colspan="4">■ ${esc(p.s.ja)}</td></tr>`;
 const row=(name,q,unit,amt)=>{ sub+=amt; return `<tr><td class="it">${name}</td><td class="r">${q}</td><td class="r n">${unit}</td><td class="r n">${yen(amt)}</td></tr>`; };
 if(mode!=='monthly' && r.initList>0){
  rows+=`<tr class="sec"><td colspan="4">初期費用</td></tr>`;
  for(const p of r.per){ const ls=p.lines.filter(l=>l.init); if(!ls.length) continue; rows+=svrow(p); for(const l of ls) rows+=row(esc(dl_(l)),'1式',yen(l.init),l.init); }
  if(r.dis) rows+=row('初期費用 お値引き','1式','',-r.dis);
  if(r.split && mode==='first'){ // first invoice only bills first instalment
   rows=`<tr class="sec"><td colspan="4">初期費用（分割 ${r.m}回払い）</td></tr>`; sub=0;
   rows+=row(`初期費用 分割 1回目（総額 ${yen(r.initNet)}）`,'1回',yen(r.splitAmt),r.splitAmt);
  } else if(r.split){ // quote: show the plan but don't add twice
   rows+=`<tr><td colspan="4" class="pre">※初期費用 ${yen(r.initNet)} は ${r.m}回の分割（月 ${yen(r.splitAmt)}、端数は最終回で調整）で月額と一緒にお支払いいただきます。</td></tr>`;
  }
 }
 const q = mode==='quote'? r.m : 1;
 const qs = mode==='quote'? `${r.m}ヶ月` : '1ヶ月';
 const label = mode==='monthly' ? `月額費用（${state.docMonth? state.docMonth.replace('-','年').replace(/^(\d+年)0?/,'$1')+'月分':''}）` : (mode==='first'?'月額費用（初月分）':`月額費用（${r.m}ヶ月）`);
 rows+=`<tr class="sec"><td colspan="4">${label}</td></tr>`;
 for(const p of r.per){ const ls=p.lines.filter(l=>l.mo); if(!ls.length) continue; rows+=svrow(p); for(const l of ls) rows+=row(esc(dl_(l)),qs,yen(l.mo),l.mo*q); }
 if(r.moDisc) rows+=row(`長期契約割引（月額 ${Math.round(r.d*100)}%）`,qs,yen(-r.moDisc),-r.moDisc*q);
 if(r.floorAdj) rows+=row('最低月額料金への調整',qs,yen(r.floorAdj),r.floorAdj*q);
 if(r.split && mode==='monthly') rows+=row('初期費用 分割払い分','1回',yen(r.splitAmt),r.splitAmt);
 return {rows,sub};
}
function buildDoc(){
 const r=compute(), mode=state.doc;
 const {rows,sub}=docRows(r,mode);
 const tax = taxOn()? Math.floor(sub*0.10) : 0, grand=sub+tax;
 const title = mode==='quote'?'御見積書':'請求書';
 const due = mode==='quote' ? '' : (mode==='first' ? jdate(iso(new Date(new Date(state.docDate+'T00:00:00').getTime()+7*864e5))) : (state.docMonth? jdate(iso(new Date(+state.docMonth.slice(0,4), +state.docMonth.slice(5,7), 0))) : ''));
 const no = state.docNo || autoNo();
 const sumRows = taxOn()
  ? `<tr><td>小計（税抜・10%対象）</td><td class="r n">${yen(sub)}</td></tr><tr><td>消費税（10%）</td><td class="r n">${yen(tax)}</td></tr><tr class="g"><td>合計（税込）</td><td class="r n">${yen(grand)}</td></tr>`
  : `<tr class="g"><td>合計</td><td class="r n">${yen(grand)}</td></tr>`;
 const totLabel = mode==='quote' ? (r.split?'契約期間の総額':'お見積金額（契約期間の総額）') : 'ご請求金額';
 const notes=[];
 if(mode==='quote'){
  notes.push(`契約期間：${jdate(state.start)}〜${jdate(endDate(state.start,r.m))}（${r.m}ヶ月）`);
  notes.push(`お支払い：初期費用${r.split?'は分割（月額と一緒に）':'は契約時'}、月額 ${yen(r.moDue)} は毎月末までに当月分を振込`);
  notes.push('有効期限：発行日から30日');
  notes.push(`期間満了後は同じ内容で1ヶ月ごとに自動更新（前月末までのご連絡で解約できます）`);
  if(r.per.some(p=>p.s.id==='line')) notes.push('LINEミニアプリは最低3ヶ月のご利用となります');
  if(r.per.some(p=>p.s.id==='sns'&&state.svc.sns.sel.x.includes('ads'))) notes.push('広告費（Meta・TikTokへのお支払い）は含みません');
  if(r.per.some(p=>p.s.id==='line'&&state.svc.line.sel.x.includes('pay'))) notes.push('決済手数料（Stripe 3.6% など）はお店のご負担です');
 } else {
  notes.push(`お支払期限：${due}`);
  notes.push('お振込手数料はご負担ください');
 }
 if(!taxOn()) notes.push('当方は適格請求書発行事業者ではありません。表示金額に消費税は加算していません。');
 const bank = set.bank? `<div class="box"><b>お振込先</b>\n${esc(set.bank)}</div>`:'';
 const html = `<div class="paper"><h1>${title}</h1>
 <div class="meta"><div><div class="to">${esc(state.cust.name||'　')} 御中</div>${state.cust.person?`<div style="margin-top:4px">${esc(state.cust.person)} 様</div>`:''}
 <p style="margin:10px 0 0">${mode==='quote'?'下記のとおりお見積り申し上げます。':'下記のとおりご請求申し上げます。'}</p></div>
 <div style="text-align:right"><div>No. <span class="n">${esc(no)}</span></div><div>発行日 ${jdate(state.docDate)}</div>${issuerBlock()}</div></div>
 <div class="total"><span>${totLabel}${taxOn()?'（税込）':''}</span><b class="n">${yen(grand)}</b></div>
 ${mode==='quote'?`<p style="margin:-8px 0 12px">月額 <b class="n">${yen(r.moDue)}</b> ／ 初期費用 <b class="n">${yen(r.initDue)}</b>${r.split?'（分割）':''}${taxOn()?'（いずれも税抜）':''}</p>`:''}
 <table><thead><tr><th>品目</th><th class="r" style="width:13%">数量</th><th class="r" style="width:17%">単価</th><th class="r" style="width:19%">金額</th></tr></thead><tbody>${rows}</tbody></table>
 <table class="sum"><tbody>${sumRows}</tbody></table>
 <div class="box"><b>備考</b>\n${notes.map(n=>'・'+esc(n)).join('\n')}</div>${bank}</div>`;
 return {html,grand,r,no,title,notes};
}

   v.split?`مشتری هزینه‌ی راه‌اندازی ${v.init} را در ${v.m} قسط، هر قسط ${v.splitAmt} (کسری ین در قسط آخر تنظیم می‌شود)، همراه ماهانه می‌پردازد.`:`مشتری هزینه‌ی راه‌اندازی ${v.init} را ظرف ۷ روز از تاریخ فاکتور ما می‌پردازد.`,
   `مشتری ماهانه‌ی ${v.mo}${v.split?' (با قسط)':''} را هر ماه تا آخر همان ماه می‌پردازد. ماه اول روزشمار حساب نمی‌شود.`,
   `پرداخت با واریز به حساب بانکی ما است و کارمزد واریز با مشتری است. ما هیچ‌وقت نمی‌خواهیم پول به حسابی به اسم کسی جز کسی که در قرارداد آمده واریز شود.`,

   `اگر مشتری ۳۰ روز یا بیشتر عقب بیفتد یا یکی از بندهای ماده ۲۱ برایش پیش بیاید، باقی اقساط و همه‌ی بدهی‌اش فوراً یک‌جا سررسید می‌شود.`,
   `اگر پرداخت ۳۰ روز یا بیشتر عقب بیفتد، بعد از اخطار کتبی می‌توانیم تا وقتی پرداخت نشده خدمات را متوقف کنیم.`]],
  ['ماده ۵ (تغییر قیمت)',[`در طول مدت قرارداد قیمت عوض نمی‌شود. برای تغییر قیمت بعد از تمدید، حداقل ۲ ماه قبل کتبی خبر می‌دهیم. اگر مشتری قبول نکند، می‌تواند قرارداد را از روز قبل از تغییر فسخ کند.`]],
  ['ماده ۶ (تسویه در پایان زودتر از موعد)',[

  ['ماده ۷ (قرارداد مستقیم)',[`این قرارداد مستقیم بین مشتری و ما است و قرارداد لیزینگ، اقساطی یا از طریق شرکت اعتباری نیست. ما مشتری را مجبور به خرید یا لیزینگ دستگاه نمی‌کنیم. (در ژاپن شکایت زیادی از «سایت با لیزینگ» هست؛ این ماده اعتماد می‌سازد.)`]],
  ['ماده ۸ (همکاری مشتری)',[

  ['ماده ۹ (تأیید و تحویل کارهای ساختنی)',[

   `مشتری ظرف ۱۰ روز از نشان دادن نسخه‌ی نهایی آن را بررسی می‌کند و اگر ایرادی دارد دقیق می‌گوید. اگر در این مدت چیزی نگوید یا شروع به استفاده کند، تحویل‌گرفته حساب می‌شود.`,

  ['ماده ۱۰ (مالکیت و مدیریت اکانت‌ها)',[

  ['ماده ۱۱ (دامنه)',[`دامنه به اسم مشتری ثبت می‌شود، حتی اگر خرید و تمدیدش را ما انجام دهیم. بعد از پایان قرارداد، اگر مشتری بخواهد، ظرف ۱۴ روز اطلاعات لازم برای انتقال (مثل کد انتقال) را می‌دهیم.`]],
  ['ماده ۱۲ (تأیید قبل از انتشار و برخورد با مشکلات)',[

  ['ماده ۱۳ (رعایت قانون و سرویس‌های بیرونی)',[

  ['ماده ۱۴ (عدم تضمین نتیجه)',[

  ['ماده ۱۵ (حقوق کارهای تحویلی)',[

  ['ماده ۱۸ (سپردن کار به دیگری)',[`می‌توانیم بخشی از کار را به شخص سوم بسپاریم، به شرطی که همین تعهدها را به او هم بدهیم؛ مسئولیت کار او با ما است.`]],
  ['ماده ۱۹ (جبران خسارت)',[

  ['ماده ۲۰ (قوه‌ی قهریه)',[`اگر به‌خاطر بلای طبیعی، بیماری همه‌گیر، جنگ، قطع برق، خرابی اینترنت، خرابی سرویس‌های بیرونی یا چیزی که تقصیر هیچ‌کدام نیست، کار عقب بیفتد یا نشود، کسی مسئول نیست.`]],
  ['ماده ۲۱ (فسخ)',[

  ['ماده ۲۲ (حذف گروه‌های مافیایی)',[
   `هر دو طرف اعلام و تضمین می‌کنیم که خودمان و مدیرانمان عضو یاکوزا یا گروه‌های ضداجتماعی نیستیم و نخواهیم بود.`,

  ['ماده ۲۳ (بعد از پایان قرارداد)',[

   `اگر ما کار را تعطیل کنیم، حداقل ۲ ماه قبل خبر می‌دهیم و تحویل بند ۱ را انجام می‌دهیم.`]],
  ['ماده ۲۴ (ممنوعیت انتقال قرارداد)',[`هیچ‌کدام بدون اجازه‌ی کتبی دیگری، جایگاه یا حق و تعهد این قرارداد را به کسی منتقل نمی‌کند یا گرو نمی‌گذارد.`]],
  ['ماده ۲۵ (اطلاع‌رسانی)',[`پیام‌های مربوط به قرارداد به آدرس این قرارداد یا ایمیل/LINE توافق‌شده فرستاده می‌شود. اگر کسی آدرس یا راه تماسش را عوض کند و خبر ندهد، پیام در زمان معمول رسیده حساب می‌شود.`]],
  ['ماده ۲۶ (بندهایی که بعد از پایان می‌مانند)',[`بعد از پایان قرارداد هم ماده ۴ (برای پول پرداخت‌نشده)، ۶، ۱۵ تا ۱۷، ۱۹، ۲۳ و ۲۷ اعتبار دارند.`]],
  ['ماده ۲۷ (قانون حاکم و دادگاه)',[`قانون ژاپن حاکم است و دعوای مربوط به این قرارداد در مرحله‌ی اول فقط در ${v.court} رسیدگی می‌شود.`]],
  ['ماده ۲۸ (مذاکره)',[`هر چیزی که در قرارداد نیامده یا تفسیرش روشن نیست را با حسن نیت با هم حل می‌کنیم.`]]
 ];
}
function renderContract(){
 $('#conChips').innerHTML=[['ja','cJa'],['fa','cFa']].map(([k,t])=>`<button type="button" class="chip" data-con="${k}" aria-pressed="${state.con===k}">${tr(t)}</button>`).join('');
 $('#conOut').innerHTML=buildContract(state.con);
}

/* ================= team view ================= */
function renderTeam(){
 const r=compute(), rate=+set.rate||0, fa=L()==='fa';
 const lab = h=>h; // hours
 const moCost = r.h*rate + r.c, inCost = r.hi*rate + r.ci;
 const moProfit = r.moNet - moCost, inProfit = r.initNet - inCost;
 const termProfit = moProfit*r.m + inProfit, termRev=r.total;
 const pct = termRev? Math.round(termProfit/termRev*100):0;
 const pill = pct>=40?'good':pct>=20?'mid':'bad';
 const rows = r.per.map(p=>{ const c=p.h*rate+p.c; const pr=p.mo*(1-r.d)-c; return `<tr><td>${esc(fa?p.s.fa:p.s.ja)}</td><td class="n num">${p.h}h</td><td class="n num">${yen(c)}</td><td class="n num">${yen(pr)}</td><td class="n num">${p.hi}h</td></tr>`; }).join('');
 $('#teamMargin').innerHTML = fa ? `<h2>سود همین انتخاب (فقط برای تیم، به مشتری نشان ندهید)</h2>
  <div class="kpis"><div><span>کار تیم در ماه</span><b>${r.h} ساعت</b></div><div><span>کار راه‌اندازی</span><b>${r.hi} ساعت</b></div>
  <div><span>سود ماهانه</span><b>${yen(moProfit)}</b></div><div><span>سود کل ${r.m} ماه</span><b>${yen(termProfit)}</b></div></div>
  <p>حاشیه‌ی سود کل دوره: <span class="pill ${pill}">${pct}٪</span> <span class="small muted">(هزینه = ساعت × ${yen(rate)} + کرایه و چاپ و سرور. زیر ۲۰٪ قرمز.)</span></p>

 for(const [id,k] of Object.entries(map)){ const e=$('#'+id); if(e) e.textContent=tr(k); }

function standalone(title,inner){
 const css=document.getElementById('papercss').textContent;
 return `<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Vazirmatn:wght@400;700&family=IBM+Plex+Mono&display=swap">
<style>body{margin:0;background:#e9e9e9;padding:16px}@page{size:A4;margin:14mm}@media print{body{background:#fff;padding:0}.bar{display:none}}.bar{max-width:794px;margin:0 auto 10px;text-align:right}.bar button{font:inherit;padding:8px 16px;border-radius:999px;border:1px solid #23417A;background:#23417A;color:#fff;cursor:pointer}${css}</style></head>
<body><div class="bar"><button onclick="window.print()">印刷 / PDF保存</button></div>${inner}</body></html>`;

const onSite = (()=>{ try{ return window.top===window.self; }catch(e){ return false; } })();
if(onSite){ document.querySelectorAll('.onsite').forEach(b=>b.hidden=false); }
function blobSave(name,html){ const u=URL.createObjectURL(new Blob([html],{type:'text/html'})); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }
async function offer(name,html,msgEl){
 const out=$(msgEl);
 if(!dl && onSite){ try{ blobSave(name,html); out.textContent=tr('saved'); }catch(e){ out.textContent=tr('noDl'); } return; }
 if(!dl){ out.textContent=tr('noDl'); return; }
 try{ await dl.save({filename:name,data:html}); out.textContent=tr('saved'); }
 catch(err){ out.textContent = err && err.code==='declined' ? tr('declined') : tr('noDl'); }
}
const safe = s => (s||'').normalize('NFKC').replace(/[^A-Za-z0-9_-]+/g,'').slice(0,24);
const fname = (kind,d) => ['ohs',kind,safe(state.cust.name),(d||'').replace(/-/g,'')].filter(Boolean).join('_')+'.html';
$('#dlDoc').onclick=()=>{ const b=buildDoc(); offer(fname(state.doc==='quote'?'mitsumorisho':'seikyusho',state.docDate), standalone(b.title,b.html), '#docMsg'); };
$('#dlCon').onclick=()=>{ offer(fname(state.con==='ja'?'keiyakusho':'contract-fa',state.signDate), standalone('契約書',buildContract(state.con)), '#conMsg'); };
$('#prDoc').onclick=()=>window.print(); $('#prCon').onclick=()=>window.print();
$('#cpDoc').onclick=()=>{ const t=docText(); try{ navigator.clipboard.writeText(t).then(()=>$('#docMsg').textContent=tr('copied'),()=>fallbackCopy(t)); }catch(e){ fallbackCopy(t); } };
function fallbackCopy(t){ $('#docMsg').innerHTML=esc(tr('copyFail'))+`<textarea style="width:100%;min-height:180px;margin-top:6px;font-size:13px" readonly>${esc(t)}</textarea>`; const ta=$('#docMsg textarea'); ta.focus(); ta.select(); }

fillInputs(); full(); showView();
})();
